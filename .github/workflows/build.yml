name: Build CSQTT Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MIPS Cross-Compiler Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu g++-mipsel-linux-gnu

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build binary with build-std
        working-directory: rust-server
        run: |
          mkdir -p bin
          echo '#!/bin/sh' > bin/mipsel-linux-gnu-g++
          echo 'exit 0' >> bin/mipsel-linux-gnu-g++
          chmod +x bin/mipsel-linux-gnu-g++
          
          PATH="$PWD/bin:$PATH" \
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_GNU_LINKER=mipsel-linux-gnu-gcc \
          cargo +nightly build \
            --target mipsel-unknown-linux-gnu \
            -Z build-std=core,alloc,std,panic_unwind \
            --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-server-mipsel
          path: rust-server/target/mipsel-unknown-linux-gnu/release/csqtt-server

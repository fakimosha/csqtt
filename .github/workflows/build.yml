name: Build CSQTT Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary with cross
        working-directory: rust-server
        run: cargo cross build --target mipsel-unknown-linux-musl -Z build-std=core,alloc,std,panic_unwind --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-server-mipsel
          path: rust-server/target/mipsel-unknown-linux-musl/release/csqtt*

name: Build CSQTT Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MIPS Cross-Compiler Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu g++-mipsel-linux-gnu libc6-dev-mipsel-cross

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build binary with build-std
        working-directory: rust-server
        run: |
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_GNU_LINKER=mipsel-linux-gnu-gcc \
          RUSTFLAGS="-C link-arg=-Wl,-dynamic-linker=/opt/lib/ld.so.1 -C link-arg=-Wl,-rpath=/opt/lib -C link-arg=-Wl,-rpath=/lib" \
          cargo +nightly build \
            --target mipsel-unknown-linux-gnu \
            -Z build-std=core,alloc,std,panic_unwind \
            --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-server-mipsel
          path: rust-server/target/mipsel-unknown-linux-gnu/release/csqtt*
